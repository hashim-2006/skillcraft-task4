<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task 04 | To-do App</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#111a31,#243c62);font-family:Segoe UI,Arial;color:#f4f7ff;padding:34px 18px}
.app{width:min(900px,100%);margin:auto;background:#121f38;border:1px solid #ffffff20;border-radius:24px;padding:30px;box-shadow:0 24px 70px #0006}
header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.eyebrow{color:#55dbc9;font-size:.75rem;font-weight:800;letter-spacing:.14em}h1{font-size:2rem;margin:8px 0}.muted{color:#aab9d2}
.form{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:10px;margin:26px 0 18px}
input{min-width:0;padding:13px;border:1px solid #394b6c;background:#0b162c;color:white;border-radius:11px;font:inherit}input:focus{outline:2px solid #55dbc9}
button{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer}.add{background:#55dbc9;color:#071729}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.filter{background:#273956;color:#dbe6f8}.filter.active{background:#887bff;color:white}
.stats{display:flex;gap:20px;color:#aab9d2;font-size:.9rem;margin:10px 0 18px}.list{display:grid;gap:10px}.task{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;padding:15px;background:#1b2b49;border:1px solid #ffffff12;border-radius:14px}.task.done .name{text-decoration:line-through;color:#8797b2}.check{width:20px;height:20px;accent-color:#55dbc9}.name{font-weight:700;overflow-wrap:anywhere}.due{font-size:.82rem;color:#aab9d2;margin-top:5px}.actions{display:flex;gap:7px}.small{padding:8px 10px;background:#304363;color:white}.delete{background:#542c43;color:#ffb8ca}.empty{text-align:center;padding:35px;color:#9aabc7;background:#0d1930;border-radius:14px}
@media(max-width:700px){.form{grid-template-columns:1fr 1fr}.form input:first-child{grid-column:1/-1}.form button{grid-column:1/-1}.task{grid-template-columns:auto 1fr}.actions{grid-column:2;justify-content:flex-end}}
</style></head><body><main class="app"><header><div><div class="eyebrow">SKILLCRAFT · TASK 04</div><h1>My task planner</h1><div class="muted">Capture tasks, set a due date and keep moving.</div></div><div class="muted" id="today"></div></header>
<form class="form" id="form"><input id="name" placeholder="What needs to be done?" required maxlength="100"><input id="date" type="date" aria-label="Due date"><input id="time" type="time" aria-label="Due time"><button class="add" id="submit">＋ Add task</button></form>
<div class="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="active">Active</button><button class="filter" data-filter="done">Completed</button></div>
<div class="stats"><span id="total">0 tasks</span><span id="pending">0 active</span><span id="completed">0 completed</span></div><div class="list" id="list"></div></main>
<script>
const $=id=>document.getElementById(id);let tasks=JSON.parse(localStorage.getItem('skillcraft-tasks')||'[]'),filter='all',editId=null;
$('today').textContent=new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
function save(){localStorage.setItem('skillcraft-tasks',JSON.stringify(tasks));render()}
function render(){let done=tasks.filter(t=>t.done).length;$('total').textContent=tasks.length+' tasks';$('pending').textContent=(tasks.length-done)+' active';$('completed').textContent=done+' completed';$('list').innerHTML='';let visible=tasks.filter(t=>filter==='all'||(filter==='active'?!t.done:t.done));if(!visible.length){$('list').innerHTML='<div class="empty">No tasks here. Add a task to get started.</div>';return}
visible.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'').localeCompare(b.time||''));
visible.forEach(t=>{let row=document.createElement('div');row.className='task'+(t.done?' done':'');let due=[t.date,t.time].filter(Boolean).join(' · ')||'No due date';row.innerHTML=`<input class="check" type="checkbox" ${t.done?'checked':''} aria-label="Mark completed"><div><div class="name"></div><div class="due"></div></div><div class="actions"><button class="small edit">Edit</button><button class="small delete">Delete</button></div>`;row.querySelector('.name').textContent=t.name;row.querySelector('.due').textContent=due;row.querySelector('.check').onchange=e=>{t.done=e.target.checked;save()};row.querySelector('.edit').onclick=()=>edit(t.id);row.querySelector('.delete').onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save()};$('list').append(row)})}
function edit(id){let t=tasks.find(x=>x.id===id);if(!t)return;editId=id;$('name').value=t.name;$('date').value=t.date||'';$('time').value=t.time||'';$('submit').textContent='Save changes';$('name').focus()}
$('form').onsubmit=e=>{e.preventDefault();let name=$('name').value.trim();if(!name)return;if(editId){let t=tasks.find(x=>x.id===editId);Object.assign(t,{name,date:$('date').value,time:$('time').value});editId=null;$('submit').textContent='＋ Add task'}else tasks.push({id:Date.now(),name,date:$('date').value,time:$('time').value,done:false});$('form').reset();save()};
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});render();
</script></body></html>
